log:
  level: info
  job_level: info

runner:
  capacity: 1
  timeout: 1h
  shutdown_timeout: 90s
  insecure: false
  fetch_interval: 5s
  env_file: ""
  labels:
    - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04
    - ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04

cache:
  enabled: true
  dir: /data/cache
  host: runner-cache.internal
  port: 8089
  proxy_port: 8088

container:
  network: ""
  privileged: false
  options: --add-host=runner-cache.internal:host-gateway
  valid_volumes: []
  # This socket belongs to the separate DinD engine, not the server's engine.
  docker_host: automount
  force_pull: true

server:
  connections:
    forgejo:
      url: https://git.example.com/
      uuid: REPLACE_WITH_RUNNER_UUID
      token_url: file:/data/token
